name: Deploy SeaFriend

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Atualizar VPS
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do GitHub
        uses: actions/checkout@v4

      - name: Preparar conexão SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Enviar arquivos para a VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          rsync -az \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='**/node_modules/' \
            --exclude='target/' \
            --exclude='**/target/' \
            --exclude='dist/' \
            --exclude='**/dist/' \
            --exclude='.env' \
            --exclude='.env.*' \
            -e "ssh -p $VPS_PORT -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes" \
            ./ "$VPS_USER@$VPS_HOST:/opt/seafriend/"

      - name: Reconstruir e iniciar API
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -p "$VPS_PORT" \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            "$VPS_USER@$VPS_HOST" \
            'cd /opt/seafriend/api &&
             docker compose -p seafriend-api -f compose.yml up -d --build &&
             curl -fsS http://127.0.0.1:3100/health'
