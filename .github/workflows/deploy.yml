name: SeaFriend Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy"
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: seafriend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy isolated API Compose project
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Deploy through pinned SSH host
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_PROJECT_DIR: ${{ secrets.VPS_PROJECT_DIR }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_PORT"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          VPS_PROJECT_DIR="${VPS_PROJECT_DIR:-/opt/seafriend}"
          if [[ ! "$VPS_PROJECT_DIR" =~ ^/[A-Za-z0-9._/-]+$ ]]; then
            echo "Invalid VPS project directory"
            exit 1
          fi
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/seafriend-vps.key"
          chmod 600 "$RUNNER_TEMP/seafriend-vps.key"
          SSH_ARGS=(-p "$VPS_PORT" -i "$RUNNER_TEMP/seafriend-vps.key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          ssh "${SSH_ARGS[@]}" "$VPS_USER@$VPS_HOST" "mkdir -p '$VPS_PROJECT_DIR'"
          ssh "${SSH_ARGS[@]}" "$VPS_USER@$VPS_HOST" \
            "if [ -f '$VPS_PROJECT_DIR/api/compose.yml' ]; then cp '$VPS_PROJECT_DIR/api/compose.yml' '$VPS_PROJECT_DIR/api/compose.yml.pre-deploy'; fi"
          rsync -az \
            --exclude='.git/' \
            --exclude='target/' \
            --exclude='**/target/' \
            --exclude='.env' \
            --exclude='.env.*' \
            -e "ssh ${SSH_ARGS[*]}" \
            ./ "$VPS_USER@$VPS_HOST:$VPS_PROJECT_DIR/"
          ssh "${SSH_ARGS[@]}" "$VPS_USER@$VPS_HOST" \
            "cd '$VPS_PROJECT_DIR/api' && docker compose -p seafriend-api -f compose.yml up -d --build && curl -fsS http://127.0.0.1:3100/health"
