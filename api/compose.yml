services:
  api:
    container_name: seafriend-api
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped

    ports:
      - "127.0.0.1:3100:3000"

    environment:
      RUST_LOG: info
      SEAFRIEND_ROOM_TTL_SECONDS: 3600
      SEAFRIEND_CLEANUP_INTERVAL_SECONDS: 30
      SEAFRIEND_PRESENCE_TIMEOUT_SECONDS: 60

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    mem_limit: 768m
    cpus: 1.5

    networks:
      - seafriend-network

networks:
  seafriend-network:
    name: seafriend-network
    driver: bridge
